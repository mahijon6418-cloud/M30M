name: Build M30 - Real strongSwan IKEv2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build M30 Android
    runs-on: ubuntu-24.04

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout M30
        uses: actions/checkout@v4


      # ============================================
      # 2. Linux dependencies
      # ============================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            bison \
            flex \
            gperf \
            perl \
            python3 \
            jq \
            make \
            libssl-dev


      # ============================================
      # 3. Java 17
      # ============================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================
      # 4. Android SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # ============================================
      # 5. Android SDK + NDK
      # ============================================
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.3.13750724'

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"


      # ============================================
      # 6. Verify Android
      # ============================================
      - name: Verify Android environment
        run: |
          java -version

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -d "$ANDROID_NDK_ROOT"
          test -x "$ANDROID_NDK_ROOT/ndk-build"

          echo "Android environment OK"


      # ============================================
      # 7. Clone official strongSwan
      # ============================================
      - name: Clone official strongSwan
        run: |
          git clone \
            --depth 1 \
            --branch 6.1.0 \
            https://github.com/strongswan/strongswan.git \
            strongswan


      # ============================================
      # 8. Prepare strongSwan
      # ============================================
      - name: Prepare strongSwan
        working-directory: strongswan
        run: |
          ./autogen.sh
          ./configure
          make dist


      # ============================================
      # 9. Clone OpenSSL
      # ============================================
      - name: Clone OpenSSL
        working-directory: strongswan
        run: |
          git clone \
            --depth 1 \
            --branch openssl-3.6.3 \
            https://github.com/openssl/openssl.git \
            openssl


      # ============================================
      # 10. Build OpenSSL for Android
      # ============================================
      - name: Build OpenSSL for Android
        working-directory: strongswan
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NO_DOCKER: '1'
        run: |
          export OPENSSL_SRC="$PWD/openssl"

          chmod +x \
            src/frontends/android/openssl/build.sh

          src/frontends/android/openssl/build.sh


      # ============================================
      # 11. Inject M30 UI
      # ============================================
      - name: Inject M30 UI
        run: |

          APP="strongswan/src/frontends/android/app"

          mkdir -p \
            "$APP/src/main/java/org/strongswan/android/ui"

          mkdir -p \
            "$APP/src/main/res/values"

          mkdir -p \
            "$APP/src/main/res/drawable"


          # M30 Activity
          cp \
            M30Activity.java \
            "$APP/src/main/java/org/strongswan/android/ui/M30Activity.java"


          # M30 colors
          cp \
            m30_colors.xml \
            "$APP/src/main/res/values/m30_colors.xml"


          # M30 strings
          cp \
            m30_strings.xml \
            "$APP/src/main/res/values/m30_strings.xml"


          # M30 theme
          cp \
            m30_themes.xml \
            "$APP/src/main/res/values/m30_themes.xml"


          # M30 icon
          cp \
            m30_icon.xml \
            "$APP/src/main/res/drawable/m30_icon.xml"


          # =========================================
          # Change launcher Activity
          # =========================================
          sed -i \
            's#android:name=".ui.MainActivity"#android:name=".ui.M30Activity"#g' \
            "$APP/src/main/AndroidManifest.xml"


          # =========================================
          # Change application icon
          # =========================================
          sed -i \
            's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/m30_icon"#g' \
            "$APP/src/main/AndroidManifest.xml"


          # =========================================
          # Change round icon
          # =========================================
          sed -i \
            's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/m30_icon"#g' \
            "$APP/src/main/AndroidManifest.xml"


          # =========================================
          # Change app name
          # =========================================
          sed -i \
            's#<string name="app_name">strongSwan VPN Client</string>#<string name="app_name">M30</string>#' \
            "$APP/src/main/res/values/strings.xml" \
            || true


          echo "======================================"
          echo "M30 UI installed"
          echo "M30 ICON installed"
          echo "strongSwan launcher replaced"
          echo "======================================"


      # ============================================
      # 12. Verify M30
      # ============================================
      - name: Verify M30 files
        run: |

          APP="strongswan/src/frontends/android/app"

          test -f \
            "$APP/src/main/java/org/strongswan/android/ui/M30Activity.java"

          test -f \
            "$APP/src/main/res/values/m30_colors.xml"

          test -f \
            "$APP/src/main/res/values/m30_strings.xml"

          test -f \
            "$APP/src/main/res/values/m30_themes.xml"

          test -f \
            "$APP/src/main/res/drawable/m30_icon.xml"

          echo "======================================"
          echo "All M30 files OK"
          echo "======================================"


      # ============================================
      # 13. BUILD DEBUG APK
      #
      # مهم:
      # assembleDebug استفاده می‌کنیم.
      #
      # Android Gradle Plugin نسخه Debug را
      # خودکار با debug keystore امضا می‌کند.
      #
      # بنابراین APK قابل نصب خواهد بود.
      # ============================================
      - name: Build signed M30 Debug APK
        working-directory: strongswan/src/frontends/android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================
      # 14. Find APK
      # ============================================
      - name: Find APK
        run: |

          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find \
            strongswan/src/frontends/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================
      # 15. Upload signed APK
      # ============================================
      - name: Upload M30 APK
        uses: actions/upload-artifact@v4
        with:
          name: M30-signed-debug
          path: |
            strongswan/src/frontends/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
