name: Build M30 - Real strongSwan IKEv2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build M30 Android
    runs-on: ubuntu-24.04

    steps:

      # --------------------------------------------------
      # 1. دریافت سورس M30
      # --------------------------------------------------
      - name: Checkout M30
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. نصب ابزارهای لینوکس
      # --------------------------------------------------
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            bison \
            flex \
            gperf \
            perl \
            python3 \
            jq \
            make \
            libssl-dev


      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      # مهم:
      # از v4 استفاده می‌کنیم.
      # packages فقط platform-tools است تا مشکل
      # قدیمی "Failed to find package tools" ایجاد نشود.
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # --------------------------------------------------
      # 5. نصب Android SDK + NDK
      # --------------------------------------------------
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.3.13750724'

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"


      # --------------------------------------------------
      # 6. بررسی محیط Android
      # --------------------------------------------------
      - name: Verify Android environment
        run: |
          echo "================================="
          echo "JAVA"
          echo "================================="
          java -version

          echo "================================="
          echo "ANDROID SDK"
          echo "================================="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "================================="
          echo "ANDROID NDK"
          echo "================================="
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"

          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          test -d "$ANDROID_NDK_ROOT"

          test -x "$ANDROID_NDK_ROOT/ndk-build"

          echo ""
          echo "Android SDK: OK"
          echo "Android NDK: OK"


      # --------------------------------------------------
      # 7. دریافت strongSwan واقعی
      # --------------------------------------------------
      # این همان موتور واقعی IKEv2 / charon است.
      # --------------------------------------------------
      - name: Clone official strongSwan
        run: |
          git clone \
            --depth 1 \
            --branch 6.1.0 \
            https://github.com/strongswan/strongswan.git \
            strongswan


      # --------------------------------------------------
      # 8. آماده سازی strongSwan
      # --------------------------------------------------
      - name: Prepare strongSwan
        working-directory: strongswan
        run: |
          ./autogen.sh
          ./configure
          make dist


      # --------------------------------------------------
      # 9. دریافت OpenSSL
      # --------------------------------------------------
      # نسخه‌ای که در تست ساخت Android پروژه strongSwan
      # استفاده می‌شود.
      # --------------------------------------------------
      - name: Clone OpenSSL
        working-directory: strongswan
        run: |
          git clone \
            --depth 1 \
            --branch openssl-3.6.3 \
            https://github.com/openssl/openssl.git \
            openssl


      # --------------------------------------------------
      # 10. ساخت OpenSSL برای Android
      # --------------------------------------------------
      - name: Build OpenSSL for Android
        working-directory: strongswan
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NO_DOCKER: '1'
        run: |
          export OPENSSL_SRC="$PWD/openssl"

          chmod +x \
            src/frontends/android/openssl/build.sh

          src/frontends/android/openssl/build.sh


      # --------------------------------------------------
      # 11. قرار دادن رابط M30 داخل پروژه رسمی strongSwan
      # --------------------------------------------------
      - name: Inject M30 UI
        run: |

          APP="strongswan/src/frontends/android/app"

          echo "M30 application directory:"
          echo "$APP"

          # Java
          mkdir -p \
            "$APP/src/main/java/org/strongswan/android/ui"

          # Resources
          mkdir -p \
            "$APP/src/main/res/values"

          # ------------------------------------------------
          # M30Activity
          # ------------------------------------------------
          cp \
            M30Activity.java \
            "$APP/src/main/java/org/strongswan/android/ui/M30Activity.java"

          # ------------------------------------------------
          # M30 colors
          # ------------------------------------------------
          cp \
            m30_colors.xml \
            "$APP/src/main/res/values/m30_colors.xml"

          # ------------------------------------------------
          # M30 strings
          # ------------------------------------------------
          cp \
            m30_strings.xml \
            "$APP/src/main/res/values/m30_strings.xml"

          # ------------------------------------------------
          # M30 themes
          # ------------------------------------------------
          cp \
            m30_themes.xml \
            "$APP/src/main/res/values/m30_themes.xml"

          # ------------------------------------------------
          # تغییر صفحه اصلی از MainActivity به M30Activity
          # ------------------------------------------------
          sed -i \
            's#android:name=".ui.MainActivity"#android:name=".ui.M30Activity"#' \
            "$APP/src/main/AndroidManifest.xml"

          # ------------------------------------------------
          # تغییر نام برنامه به M30
          # ------------------------------------------------
          sed -i \
            's#<string name="app_name">strongSwan VPN Client</string>#<string name="app_name">M30</string>#' \
            "$APP/src/main/res/values/strings.xml" \
            || true

          echo ""
          echo "================================="
          echo "M30 UI injected successfully"
          echo "================================="


      # --------------------------------------------------
      # 12. بررسی فایل‌های M30
      # --------------------------------------------------
      - name: Verify M30 files
        run: |

          APP="strongswan/src/frontends/android/app"

          echo "Checking M30Activity..."

          test -f \
            "$APP/src/main/java/org/strongswan/android/ui/M30Activity.java"

          echo "Checking M30 colors..."

          test -f \
            "$APP/src/main/res/values/m30_colors.xml"

          echo "Checking M30 strings..."

          test -f \
            "$APP/src/main/res/values/m30_strings.xml"

          echo "Checking M30 theme..."

          test -f \
            "$APP/src/main/res/values/m30_themes.xml"

          echo ""
          echo "All M30 files: OK"


      # --------------------------------------------------
      # 13. ساخت APK
      # --------------------------------------------------
      - name: Build M30 APK
        working-directory: strongswan/src/frontends/android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleRelease \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 14. پیدا کردن APK
      # --------------------------------------------------
      - name: Find APK
        run: |

          echo "================================="
          echo "Searching for APK..."
          echo "================================="

          find \
            strongswan/src/frontends/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # --------------------------------------------------
      # 15. ذخیره APK در GitHub Actions
      # --------------------------------------------------
      - name: Upload M30 APK
        uses: actions/upload-artifact@v4
        with:
          name: M30-real-strongSwan-IKEv2
          path: |
            strongswan/src/frontends/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
