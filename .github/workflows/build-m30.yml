name: Build M30 VPN - Real strongSwan IKEv2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build M30 VPN Android
    runs-on: ubuntu-24.04

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout M30 VPN
        uses: actions/checkout@v4


      # ============================================
      # 2. Linux dependencies
      # ============================================
      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            bison \
            flex \
            gperf \
            perl \
            python3 \
            jq \
            make \
            libssl-dev


      # ============================================
      # 3. Java 17
      # ============================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================
      # 4. Android SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'


      # ============================================
      # 5. Android SDK + NDK
      # ============================================
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.3.13750724'

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"


      # ============================================
      # 6. Verify Android
      # ============================================
      - name: Verify Android environment
        run: |
          java -version

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -d "$ANDROID_NDK_ROOT"
          test -x "$ANDROID_NDK_ROOT/ndk-build"

          echo "Android environment OK"


      # ============================================
      # 7. Clone official strongSwan
      # ============================================
      - name: Clone official strongSwan
        run: |
          git clone \
            --depth 1 \
            --branch 6.1.0 \
            https://github.com/strongswan/strongswan.git \
            strongswan


      # ============================================
      # 8. Prepare strongSwan
      # ============================================
      - name: Prepare strongSwan
        working-directory: strongswan
        run: |
          ./autogen.sh
          ./configure
          make dist


      # ============================================
      # 9. Clone OpenSSL
      # ============================================
      - name: Clone OpenSSL
        working-directory: strongswan
        run: |
          git clone \
            --depth 1 \
            --branch openssl-3.6.3 \
            https://github.com/openssl/openssl.git \
            openssl


      # ============================================
      # 10. Build OpenSSL for Android
      # ============================================
      - name: Build OpenSSL for Android
        working-directory: strongswan
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NO_DOCKER: '1'
        run: |
          export OPENSSL_SRC="$PWD/openssl"

          chmod +x \
            src/frontends/android/openssl/build.sh

          src/frontends/android/openssl/build.sh


      # ============================================
      # 11. Configure unique M30 VPN Application ID
      # ============================================
      - name: Configure M30 VPN Application ID
        working-directory: strongswan/src/frontends/android
        run: |

          sed -i \
            's/applicationId "org.strongswan.android"/applicationId "com.m30.vpn"/' \
            app/build.gradle

          echo "======================================"
          echo "M30 VPN Application ID"
          echo "======================================"

          grep -n "applicationId" app/build.gradle


      # ============================================
      # 12. Inject M30 VPN UI
      # ============================================
      - name: Inject M30 VPN UI
        run: |

          APP="strongswan/src/frontends/android/app"

          mkdir -p \
            "$APP/src/main/java/org/strongswan/android/ui"

          mkdir -p \
            "$APP/src/main/res/values"

          mkdir -p \
            "$APP/src/main/res/drawable"


          # =========================================
          # M30 Activity
          # =========================================
          cp \
            M30Activity.java \
            "$APP/src/main/java/org/strongswan/android/ui/M30Activity.java"


          # =========================================
          # M30 colors
          # =========================================
          cp \
            m30_colors.xml \
            "$APP/src/main/res/values/m30_colors.xml"


          # =========================================
          # M30 strings
          # =========================================
          cp \
            m30_strings.xml \
            "$APP/src/main/res/values/m30_strings.xml"


          # =========================================
          # M30 theme
          # =========================================
          cp \
            m30_themes.xml \
            "$APP/src/main/res/values/m30_themes.xml"


          # =========================================
          # M30 icon
          # =========================================
          cp \
            m30_icon.xml \
            "$APP/src/main/res/drawable/m30_icon.xml"


          # =========================================
          # Launcher Activity
          # =========================================
          sed -i \
            's#android:name=".ui.MainActivity"#android:name=".ui.M30Activity"#g' \
            "$APP/src/main/AndroidManifest.xml"


          # =========================================
          # Application name = M30 VPN
          # =========================================
          sed -i \
            's#android:label="@string/app_name"#android:label="@string/m30_app_name"#g' \
            "$APP/src/main/AndroidManifest.xml"


          # =========================================
          # Application icon
          # =========================================
          sed -i \
            's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/m30_icon"#g' \
            "$APP/src/main/AndroidManifest.xml"


          # =========================================
          # Round icon
          # =========================================
          sed -i \
            's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/m30_icon"#g' \
            "$APP/src/main/AndroidManifest.xml"


          # =========================================
          # Set app_name to M30 VPN
          # =========================================
          sed -i \
            's#<string name="app_name">strongSwan VPN Client</string>#<string name="app_name">M30 VPN</string>#g' \
            "$APP/src/main/res/values/strings.xml" \
            || true


          # =========================================
          # Ensure m30_app_name exists
          # =========================================
          cat > "$APP/src/main/res/values/m30_strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="m30_app_name">M30 VPN</string>
          </resources>
          EOF


          echo "======================================"
          echo "M30 VPN UI installed"
          echo "Application ID: com.m30.vpn"
          echo "Application Name: M30 VPN"
          echo "Custom Icon: M30"
          echo "======================================"


      # ============================================
      # 13. Verify M30 VPN configuration
      # ============================================
      - name: Verify M30 VPN configuration
        run: |

          APP="strongswan/src/frontends/android/app"


          echo "Checking M30Activity..."

          test -f \
            "$APP/src/main/java/org/strongswan/android/ui/M30Activity.java"


          echo "Checking M30 icon..."

          test -f \
            "$APP/src/main/res/drawable/m30_icon.xml"


          echo "Checking M30 colors..."

          test -f \
            "$APP/src/main/res/values/m30_colors.xml"


          echo "Checking M30 strings..."

          test -f \
            "$APP/src/main/res/values/m30_strings.xml"


          echo "Checking M30 theme..."

          test -f \
            "$APP/src/main/res/values/m30_themes.xml"


          echo "Checking Application ID..."

          grep -q \
            'applicationId "com.m30.vpn"' \
            "$APP/build.gradle"


          echo "Checking M30 VPN name..."

          grep -q \
            'M30 VPN' \
            "$APP/src/main/res/values/m30_strings.xml"


          echo "======================================"
          echo "M30 VPN configuration OK"
          echo "======================================"


      # ============================================
      # 14. Build signed DEBUG APK
      # ============================================
      - name: Build signed M30 VPN Debug APK
        working-directory: strongswan/src/frontends/android
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |

          chmod +x gradlew

          ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace


      # ============================================
      # 15. Find APK
      # ============================================
      - name: Find M30 VPN APK
        run: |

          echo "======================================"
          echo "M30 VPN APK FILES"
          echo "======================================"

          find \
            strongswan/src/frontends/android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ============================================
      # 16. Upload APK
      # ============================================
      - name: Upload M30 VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: M30-VPN-signed-debug
          path: |
            strongswan/src/frontends/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
